version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: infra/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://navdrishti:password@db:5432/navdrishti_gis
      - REDIS_URL=redis://cache:6379/0
      - ENABLE_DEMO_MODE=true
    depends_on:
      - db
      - cache

  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: navdrishti
      POSTGRES_PASSWORD: password
      POSTGRES_DB: navdrishti_gis
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/init.sql

  cache:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
